{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Is this image AI-generated or real?</h1>
  <p class="muted">Upload a JPG or PNG (up to {{ max_mb }} MB). The image is analysed in memory and is not stored.</p>
  <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="image" accept=".jpg,.jpeg,.png,image/jpeg,image/png" required>
    <button type="submit">Analyse image</button>
  </form>
</section>
{% endblock %}
